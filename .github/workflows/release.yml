name: Tag the release

# Each new version (js/version.js) pushed to main gets its tag (v1.4.0) and a GitHub release,
# with the commit message as its notes.
on:
  push:
    branches: [main]
    paths: [js/version.js]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create the tag and release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^export const VERSION = "\([0-9.]*\)";$/\1/p' js/version.js)
          test -n "$version"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version already released"
            exit 0
          fi
          git log -1 --format=%B "$GITHUB_SHA" > notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "$version" --notes-file notes.md
